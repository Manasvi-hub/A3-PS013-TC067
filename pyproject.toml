[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic"
version = "0.1.0"
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "streamlit>=1.38",
    "pandas>=2.2"
]

[project.scripts]
forensic = "forensic.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
